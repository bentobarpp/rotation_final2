<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trocas - Rotation</title>
  <meta name="description" content="Anuncie tênis para troca, envie e receba propostas ou converse via chat.">
  <style>
    body {
      background: linear-gradient(to bottom, #26272B, #38393e 85%);
      color: #f4f4f4;
      font-family: 'Segoe UI', Arial, sans-serif;
      margin: 0;
      padding-top: 95px;
      box-sizing: border-box;
      min-height: 100vh;
    }

    #nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      background: #232426;
      padding: 18px 0;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 22px;
      z-index: 1000;
      box-shadow: 0 3px 18px #0008;
    }

    #nav .logo {
      height: 43px;
      margin-right: 10px;
    }

    #nav a {
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      padding: 7px 20px;
      border-radius: 8px;
    }

    #nav a.selected,
    #nav a:hover {
      background: rgba(108, 110, 254, 0.13);
    }

    #nav input {
      border-radius: 8px;
      border: none;
      background: #33353a;
      padding: 7px 18px;
      color: #fff;
      font-size: 1rem;
      width: 210px;
    }

    main {
      max-width: 1000px;
      margin: 0 auto 70px;
      width: 98vw;
    }

    h1 {
      text-align: center;
      font-size: 2.2rem;
      color: #fff;
      font-weight: 700;
      margin-bottom: 16px;
    }

    h2 {
      color: #bbccff;
      text-align: center;
      font-size: 1.19rem;
      margin: 23px 0 12px;
    }

    form {
      background: rgba(38, 38, 38, 0.92);
      border-radius: 16px;
      box-shadow: 0 6px 26px #181c2855;
      padding: 24px 18px 13px 18px;
      margin: 0 auto 33px auto;
      color: #dde3ff;
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-width: 420px;
      width: 100%;
      box-sizing: border-box;
    }

    label {
      font-weight: 700;
      color: #b5b8ff;
    }

    input[type="text"],
    input[type="file"],
    textarea {
      background: #222733;
      border: none;
      color: white;
      width: calc(100% - 24px);
      padding: 12px;
      font-size: 1rem;
      border-radius: 8px;
      outline: none;
      margin-bottom: 7px;
      margin-top: 2px;
      box-sizing: border-box;
    }

    input[type="file"] {
      background: #16181f;
      color: #c1c1f2;
    }

    textarea {
      min-height: 66px;
      max-height: 140px;
      resize: vertical;
      font-family: 'Segoe UI', Arial;
    }

    .img-preview {
      display: flex;
      gap: 10px;
      margin: 7px 0 4px;
      flex-wrap: wrap;
    }

    .img-preview img {
      width: 72px;
      height: 72px;
      border-radius: 14px;
      object-fit: cover;
      background: #191a1e;
      box-shadow: 0 1px 7px #131d27;
      border: 2px solid #343869;
    }

    button.submit-btn {
      background: linear-gradient(90deg, #6c6efe 0%, #3f42dc 85%);
      color: white;
      border-radius: 13px;
      font-weight: 700;
      font-size: 1.13rem;
      padding: 12px 0;
      margin-top: 11px;
      cursor: pointer;
      border: none;
      box-shadow: 0 2px 18px #6c6efe33;
    }

    button.submit-btn:hover {
      background: #4549b9;
      box-shadow: 0 6px 20px #6c6effbb;
    }

    .barra-busca-area {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 21px;
    }

    .barra-busca-area input {
      width: 380px;
      border-radius: 14px;
      border: none;
      padding: 13px 21px;
      font-size: 1.09rem;
      background: #282b45;
      color: #efe;
      box-shadow: 0 2px 10px #272a4457;
    }

    .barra-busca-area input:focus {
      box-shadow: 0 7px 22px #686ff8b6;
    }

    #sneaker-list {
      display: flex;
      flex-wrap: wrap;
      gap: 38px;
      justify-content: center;
    }

    .sneaker-card {
      background: #222334fa;
      border-radius: 22px;
      width: 375px;
      min-height: 420px;
      box-shadow: 0 7px 32px #23244445;
      padding: 19px 13px 23px 13px;
      display: flex;
      flex-direction: column;
      align-items: center;
      opacity: 0;
      transform: scale(0.95) translateY(50px);
      transition: opacity 0.8s ease, transform 0.8s ease;
      position: relative;
      cursor: pointer;
    }

    .sneaker-card.visible {
      opacity: 1;
      transform: scale(1) translateY(0);
    }

    .card-gallery {
      width: 100%;
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 14px;
    }

    .card-gallery img {
      width: 110px;
      height: 110px;
      border-radius: 16px;
      object-fit: cover;
      background: #232344;
      box-shadow: 0 2px 10px #232c;
      border: 2.5px solid #313584;
      cursor: pointer;
    }

    .card-gallery img.selected {
      border-color: #6c6efe;
    }

    .sneaker-name {
      font-weight: 700;
      font-size: 1.22rem;
      color: #f6f8ff;
      margin-bottom: 7px;
      text-align: center;
    }

    .sneaker-desc {
      font-size: .98rem;
      color: #c6d0ff;
      margin-bottom: 13px;
      text-align: center;
    }

    .sneaker-request {
      font-size: .99rem;
      color: #88e8ef;
      text-align: center;
      margin-bottom: 15px;
    }

    .buttons-container {
      display: flex;
      gap: 17px;
      width: 100%;
      justify-content: center;
    }

    button.proposta-btn,
    button.chat-btn {
      flex: 1 1 120px;
      padding: 13px 0;
      border-radius: 13px;
      font-size: 1.11rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
    }

    button.proposta-btn {
      background: linear-gradient(90deg, #6c6efe 0%, #3237bb 100%);
      color: white;
      box-shadow: 0 4px 15px #606fff44;
    }

    button.proposta-btn:hover {
      background: #2b2ffb;
    }

    button.chat-btn {
      background: #434647;
      color: #bbccee;
    }

    button.chat-btn:hover {
      background: #686d83;
      color: white;
    }

    button.vendido-btn {
      margin-top: 10px;
      background: #e74c3c;
      color: white;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 8px 16px;
      border: none;
      cursor: pointer;
      transition: background-color 0.25s;
    }

    button.vendido-btn:hover {
      background-color: #c0392b;
    }

    #chatModal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(8, 13, 33, 0.98);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 2000;
    }

    #chatModal.active {
      display: flex;
    }

    #chatWindow {
      background: #181c2f;
      width: 350px;
      height: 470px;
      border-radius: 22px;
      display: flex;
      flex-direction: column;
    }

    #chatHeader {
      background: #28359d;
      color: #ddf;
      padding: 14px 22px;
      font-weight: 700;
      font-size: 1.13rem;
      display: flex;
      justify-content: space-between;
    }

    #closeChat {
      background: none;
      border: none;
      color: #bbccff;
      font-size: 1.4rem;
      cursor: pointer;
    }

    #closeChat:hover {
      color: white;
    }

    #chatMessages {
      flex: 1;
      overflow-y: auto;
      padding: 17px 14px;
      font-size: 1.01rem;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .msg {
      max-width: 70%;
      padding: 9px 14px;
      border-radius: 17px;
      word-break: break-word;
    }

    .msg.sent {
      align-self: flex-end;
      background: #4f55d1;
      color: white;
    }

    .msg.received {
      align-self: flex-start;
      background: #344566;
      color: #d1defb;
    }

    #chatInputContainer {
      border-top: 1px solid #586dcc;
      display: flex;
      padding: 13px 16px;
      gap: 10px;
    }

    #chatInput {
      flex: 1;
      padding: 10px 15px;
      border-radius: 18px;
      border: none;
      font-size: 1rem;
      outline: none;
      background: #23283e;
      color: white;
    }

    #chatSendBtn {
      background: #4f55d1;
      border: none;
      color: white;
      font-weight: 700;
      font-size: 1rem;
      border-radius: 18px;
      padding: 9px 21px;
      cursor: pointer;
    }

    #chatSendBtn:disabled {
      opacity: 0.44;
      cursor: not-allowed;
    }

    #chatSendBtn:not(:disabled):hover {
      background: #2b2fff;
    }

    .modal-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1050;
      background: rgba(0, 0, 0, 0.95);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .detalhe-modal {
      max-width: 530px;
      width: 95vw;
      padding: 32px 22px 19px 22px;
      background: #23253f;
      border-radius: 23px;
      box-shadow: 0 13px 44px #2324d8c8;
      position: relative;
    }

    .fechar-detalhe {
      position: absolute;
      top: 12px;
      right: 22px;
      background: none;
      border: none;
      color: #bbccff;
      font-size: 2.4rem;
      font-weight: 700;
      cursor: pointer;
    }

    .detalhe-name {
      color: #fff;
      text-align: center;
      font-size: 2.1rem;
      margin-bottom: 16px;
      font-weight: 700;
    }

    .detalhe-modal img {
      display: block;
      width: 96%;
      max-width: 410px;
      margin: 24px auto 12px auto;
      border-radius: 20px;
      box-shadow: 0 6px 20px #27298ede;
    }

    .detalhe-req {
      font-size: 1.13rem;
      color: #9bdef5;
      font-weight: 600;
      margin: 10px 0;
    }

    .detalhe-desc {
      font-size: 1.06rem;
      color: #c4e7f8;
      margin: 13px 0 21px;
    }

    .detalhe-btn {
      display: block;
      width: 100%;
      margin: 18px auto 0 auto;
      padding: 16px 0;
      font-weight: 700;
      font-size: 1.13rem;
      border-radius: 13px;
      background: linear-gradient(90deg, #6c6efe 0%, #3237bb 100%);
      color: white;
      cursor: pointer;
      border: none;
    }

    .detalhe-btn:hover {
      background: #2326e1;
    }

    @media (max-width: 700px) {
      main {
        max-width: 97vw;
      }

      .sneaker-card {
        width: 97vw;
        max-width: 330px;
      }

      .detalhe-modal img {
        max-width: 98vw;
      }
    }
  </style>
</head>

<body>
  <div id="nav">
    <img class="logo" src="/Galery/BannerRotation.png" alt="logo rotation">
    <a href="/home.html">Home</a>
    <a href="/shop.html">Shop</a>
    <a href="/trocas.html" class="selected">Trocas</a>
    <a href="/social.html">Social</a>
    <a href="/perfil.html">Perfil</a>
    <input type="text" id="txtBusca" placeholder="Buscar sneakers..." />
    <a class="logout-btn" href="/index.html">Sair</a>

  </div>

  <main>
    <h1>Coloque seu tênis para troca</h1>
    <form id="sneakerForm" enctype="multipart/form-data">
      <label for="shoeName">Nome do Tênis:</label>
      <input type="text" id="shoeName" required>
      <label for="shoeDesc">Descrição:</label>
      <textarea id="shoeDesc" rows="3"></textarea>
      <label for="shoeImgs">Upload até 3 imagens:</label>
      <input id="shoeImgs" type="file" accept="image/*" multiple required>
      <div class="img-preview" id="imgPreview"></div>
      <label for="shoeRequest">Tênis que deseja receber em troca:</label>
      <input type="text" id="shoeRequest" required>
      <button type="submit" class="submit-btn">Adicionar para Troca</button>
    </form>

    <div class="barra-busca-area">
      <input type="text" id="buscaTroca" placeholder="Buscar nos anúncios..." />
    </div>

    <h2>Tenis disponíveis para troca</h2>
    <section id="sneaker-list"></section>
  </main>

  <div id="chatModal" role="dialog" aria-modal="true" aria-labelledby="chatHeader" hidden>
    <div id="chatWindow">
      <header id="chatHeader">
        <span id="chatTitle">Chat</span>
        <button id="closeChat" aria-label="Fechar chat">&times;</button>
      </header>
      <div id="chatMessages"></div>
      <div id="chatInputContainer">
        <input type="text" id="chatInput" placeholder="Digite sua mensagem..." autocomplete="off" />
        <button id="chatSendBtn" disabled>Enviar</button>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('sneakerForm'),
      list = document.getElementById('sneaker-list'),
      imgInput = document.getElementById('shoeImgs'),
      imgPreview = document.getElementById('imgPreview');

    let sneakers = JSON.parse(localStorage.getItem('sneakers')) || [],
      chats = JSON.parse(localStorage.getItem('chats')) || {},
      activeChat = null;

    imgInput.addEventListener('change', function () {
      imgPreview.innerHTML = '';
      const files = Array.from(this.files).slice(0, 3);
      files.forEach(file => {
        if (!file.type.startsWith('image/')) return;
        const reader = new FileReader();
        reader.onload = e => {
          const imgEl = document.createElement('img');
          imgEl.src = e.target.result;
          imgPreview.appendChild(imgEl);
        };
        reader.readAsDataURL(file);
      });
    });

    function getBase64Images(files, cb) {
      let results = [];
      const valid = Array.from(files).slice(0, 3);
      if (valid.length === 0) return cb([]);
      let loaded = 0;
      valid.forEach((file, idx) => {
        if (!file.type.startsWith('image/')) return;
        const reader = new FileReader();
        reader.onload = e => {
          results[idx] = e.target.result;
          loaded++;
          if (loaded === valid.length) cb(results.filter(Boolean));
        };
        reader.readAsDataURL(file);
      });
    }

    function createCard(sneaker, idx) {
      const card = document.createElement('div');
      card.className = 'sneaker-card';
      let gal = '';
      sneaker.imgs.forEach(img => {
        gal += `<img src="${img}">`;
      });
      card.innerHTML = `
                <div class="card-gallery">${gal}</div>
                <div class="sneaker-name">${sneaker.name}</div>
                <div class="sneaker-desc">${sneaker.description || ""}</div>
                <div class="sneaker-request"><b>Trocar por:</b> ${sneaker.request}</div>
                <div class="buttons-container">
                    <button class="proposta-btn" onclick="redirectToDetailPage(${idx})">Proposta</button>
                    <button class="chat-btn" onclick="openChat('user_${idx}', '${sneaker.name}')">Chat</button>
                    <button class="vendido-btn" onclick="markAsSold(this)">Marcar como Vendido</button>
                </div>`;
      list.appendChild(card);
      setTimeout(() => card.classList.add('visible'), 120);

      // Redirecionar ao clicar no card inteiro
      card.onclick = () => redirectToDetailPage(idx);
    }

    function renderSneakers() {
      list.innerHTML = '';
      sneakers.forEach(createCard);
      observeAllCards();
    }

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      const name = this.shoeName.value.trim(),
        description = this.shoeDesc.value.trim(),
        request = this.shoeRequest.value.trim(),
        files = this.shoeImgs.files;

      if (!name || !request || files.length === 0) {
        alert("Preencha todos os campos obrigatórios!");
        return;
      }

      getBase64Images(files, imgs => {
        sneakers.push({ name, description, imgs, request });
        localStorage.setItem('sneakers', JSON.stringify(sneakers));
        renderSneakers();
        form.reset();
        imgPreview.innerHTML = "";
      });
    });

    // Nova função para redirecionamento
    function redirectToDetailPage(idx) {
      // Vamos assumir que a página de detalhes é '/produto.html?id=<ID>'
      window.location.href = `/produto.html?id=${idx}`;
    }

    function openChat(chatId, sneakerName) {
      activeChat = chatId;
      document.getElementById('chatTitle').textContent = "Chat - " + sneakerName;
      document.getElementById('chatMessages').innerHTML = '';
      document.getElementById('chatModal').hidden = false;
      loadMessages(chatId);
      document.getElementById('chatInput').value = '';
      document.getElementById('chatSendBtn').disabled = true;
      document.getElementById('chatInput').focus();
    }

    function closeChat() {
      document.getElementById('chatModal').hidden = true;
      activeChat = null;
    }

    document.getElementById('closeChat').onclick = closeChat;
    document.getElementById('chatModal').onclick = e => {
      if (e.target == document.getElementById('chatModal')) closeChat();
    };

    function loadMessages(chatId) {
      const msgs = chats[chatId] || [];
      const chatMessages = document.getElementById('chatMessages');
      chatMessages.innerHTML = '';
      msgs.forEach(m => addMsgToChat(m.sender, m.text));
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function addMsgToChat(sender, text) {
      const msgDiv = document.createElement('div');
      msgDiv.textContent = text;
      msgDiv.className = 'msg ' + (sender === 'user' ? 'sent' : 'received');
      document.getElementById('chatMessages').appendChild(msgDiv);
      document.getElementById('chatMessages').scrollTop = document.getElementById('chatMessages').scrollHeight;
    }

    document.getElementById('chatInput').addEventListener('input', () => {
      document.getElementById('chatSendBtn').disabled = document.getElementById('chatInput').value.trim() === '';
    });

    document.getElementById('chatSendBtn').onclick = () => {
      if (!activeChat || document.getElementById('chatInput').value.trim() === '') return;
      if (!chats[activeChat]) chats[activeChat] = [];
      const msg = document.getElementById('chatInput').value.trim();
      chats[activeChat].push({ sender: 'user', text: msg });
      localStorage.setItem('chats', JSON.stringify(chats));
      addMsgToChat('user', msg);
      document.getElementById('chatInput').value = '';
      document.getElementById('chatSendBtn').disabled = true;
      setTimeout(() => {
        const resp = "Obrigado pela mensagem! Responderemos em breve.";
        chats[activeChat].push({ sender: 'seller', text: resp });
        localStorage.setItem('chats', JSON.stringify(chats));
        addMsgToChat('seller', resp);
      }, 1200);
    };

    const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          observer.unobserve(entry.target);
        }
      });
    }, {
      threshold: 0.13
    });

    function observeAllCards() {
      document.querySelectorAll('.sneaker-card').forEach(card => {
        if (!card.classList.contains('visible')) observer.observe(card);
      });
    }

    function markAsSold(button) {
      button.parentNode.parentNode.style.opacity = '0.5';
      button.textContent = "Vendido";
      button.disabled = true;
    }

    document.getElementById('buscaTroca').addEventListener('input', function () {
      const term = this.value.trim().toLowerCase();
      document.querySelectorAll('.sneaker-card').forEach(card => {
        const txt = card.innerText.toLowerCase();
        card.style.display = term.length === 0 || txt.includes(term) ? "" : "none";
      });
    });

    renderSneakers();
  </script>
</body>

</html>
