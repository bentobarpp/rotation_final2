<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trocas - Rotation</title>
  <meta name="description" content="Anuncie tênis para troca, envie e receba propostas ou converse via chat.">
  <link rel="stylesheet" href="/Css/toast.css" />
  <link rel="stylesheet" href="/Css/rotation-ui.css" />
  <style>
    body {
      background: linear-gradient(to bottom, #26272B, #38393e 85%);
      color: #f4f4f4;
      font-family: 'Segoe UI', Arial, sans-serif;
      margin: 0;
      padding-top: 80px;
      box-sizing: border-box;
      min-height: 100vh;
    }

    #nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background: #232426;
      padding: 18px 0 14px 0;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 15px;
      z-index: 1000;
      box-shadow: 0 3px 18px #0008;
      box-sizing: border-box;
    }

    #nav .logo {
      height: 43px;
      margin-right: 10px;
    }

    #nav a {
      color: #fff;
      text-decoration: none;
      font-weight: 500;
      margin: 0 7px;
      padding: 7px 18px;
      border-radius: 8px;
    }

    #nav a.selected,
    #nav a:hover {
      background: rgba(108, 110, 254, 0.13);
    }

    #nav input {
      border-radius: 8px;
      border: none;
      background: #33353a;
      padding: 7px 18px;
      color: #fff;
      font-size: 1rem;
      width: 210px;
    }

    main {
      max-width: 1000px;
      margin: 0 auto 70px;
      width: 98vw;
    }

    h1 {
      text-align: center;
      font-size: 2.2rem;
      color: #fff;
      font-weight: 700;
      margin-bottom: 16px;
    }

    h2 {
      color: #bbccff;
      text-align: center;
      font-size: 1.19rem;
      margin: 23px 0 12px;
    }

    form {
      background: rgba(38, 38, 38, 0.92);
      border-radius: 16px;
      box-shadow: 0 6px 26px #181c2855;
      padding: 24px 18px 13px 18px;
      margin: 0 auto 33px auto;
      color: #dde3ff;
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-width: 420px;
      width: 100%;
      box-sizing: border-box;
    }

    label {
      font-weight: 700;
      color: #b5b8ff;
    }

    input[type="text"],
    input[type="file"],
    textarea {
      background: #222733;
      border: none;
      color: white;
      width: calc(100% - 24px);
      padding: 12px;
      font-size: 1rem;
      border-radius: 8px;
      outline: none;
      margin-bottom: 7px;
      margin-top: 2px;
      box-sizing: border-box;
    }

    input[type="file"] {
      background: #16181f;
      color: #c1c1f2;
    }

    textarea {
      min-height: 66px;
      max-height: 140px;
      resize: vertical;
      font-family: 'Segoe UI', Arial;
    }

    .img-preview {
      display: flex;
      gap: 10px;
      margin: 7px 0 4px;
      flex-wrap: wrap;
    }

    .img-preview img {
      width: 72px;
      height: 72px;
      border-radius: 14px;
      object-fit: cover;
      background: #191a1e;
      box-shadow: 0 1px 7px #131d27;
      border: 2px solid #343869;
    }

    button.submit-btn {
      background: linear-gradient(90deg, #6c6efe 0%, #3f42dc 85%);
      color: white;
      border-radius: 13px;
      font-weight: 700;
      font-size: 1.13rem;
      padding: 12px 0;
      margin-top: 11px;
      cursor: pointer;
      border: none;
      box-shadow: 0 2px 18px #6c6efe33;
    }

    button.submit-btn:hover {
      background: #4549b9;
      box-shadow: 0 6px 20px #6c6effbb;
    }

    .barra-busca-area {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 21px;
    }

    .barra-busca-area input {
      width: 380px;
      border-radius: 14px;
      border: none;
      padding: 13px 21px;
      font-size: 1.09rem;
      background: #282b45;
      color: #efe;
      box-shadow: 0 2px 10px #272a4457;
    }

    .barra-busca-area input:focus {
      box-shadow: 0 7px 22px #686ff8b6;
    }

    #sneaker-list {
      display: flex;
      flex-wrap: wrap;
      gap: 38px;
      justify-content: center;
    }

    .sneaker-card {
      background: #222334fa;
      border-radius: 22px;
      width: 375px;
      min-height: 420px;
      box-shadow: 0 7px 32px #23244445;
      padding: 19px 13px 23px 13px;
      display: flex;
      flex-direction: column;
      align-items: center;
      opacity: 0;
      transform: scale(0.95) translateY(50px);
      transition: opacity 0.8s ease, transform 0.8s ease;
      position: relative;
      cursor: pointer;
    }

    .sneaker-card.visible {
      opacity: 1;
      transform: scale(1) translateY(0);
    }

    .card-gallery {
      width: 100%;
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 14px;
    }

    .card-gallery img {
      width: 110px;
      height: 110px;
      border-radius: 16px;
      object-fit: cover;
      background: #232344;
      box-shadow: 0 2px 10px #232c;
      border: 2.5px solid #313584;
      cursor: pointer;
    }

    .card-gallery img.selected {
      border-color: #6c6efe;
    }

    .sneaker-name {
      font-weight: 700;
      font-size: 1.22rem;
      color: #f6f8ff;
      margin-bottom: 7px;
      text-align: center;
    }

    .sneaker-desc {
      font-size: .98rem;
      color: #c6d0ff;
      margin-bottom: 13px;
      text-align: center;
    }

    .sneaker-request {
      font-size: .99rem;
      color: #88e8ef;
      text-align: center;
      margin-bottom: 15px;
    }

    .buttons-container {
      display: flex;
      gap: 17px;
      width: 100%;
      justify-content: center;
    }

    button.proposta-btn,
    button.chat-btn {
      flex: 1 1 120px;
      padding: 13px 0;
      border-radius: 13px;
      font-size: 1.11rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
    }

    button.proposta-btn {
      background: linear-gradient(90deg, #6c6efe 0%, #3237bb 100%);
      color: white;
      box-shadow: 0 4px 15px #606fff44;
    }

    button.proposta-btn:hover {
      background: #2b2ffb;
    }

    button.chat-btn {
      background: #434647;
      color: #bbccee;
    }

    button.chat-btn:hover {
      background: #686d83;
      color: white;
    }

    button.vendido-btn {
      margin-top: 10px;
      background: #e74c3c;
      color: white;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 8px 16px;
      border: none;
      cursor: pointer;
      transition: background-color 0.25s;
    }

    button.vendido-btn:hover {
      background-color: #c0392b;
    }

    #chatModal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(8, 13, 33, 0.98);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 2000;
    }

    #chatModal.active {
      display: flex;
    }

    #chatWindow {
      background: #181c2f;
      width: 350px;
      height: 470px;
      border-radius: 22px;
      display: flex;
      flex-direction: column;
    }

    #chatHeader {
      background: #28359d;
      color: #ddf;
      padding: 14px 22px;
      font-weight: 700;
      font-size: 1.13rem;
      display: flex;
      justify-content: space-between;
    }

    #closeChat {
      background: none;
      border: none;
      color: #bbccff;
      font-size: 1.4rem;
      cursor: pointer;
    }

    #closeChat:hover {
      color: white;
    }

    #chatMessages {
      flex: 1;
      overflow-y: auto;
      padding: 17px 14px;
      font-size: 1.01rem;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .msg {
      max-width: 70%;
      padding: 9px 14px;
      border-radius: 17px;
      word-break: break-word;
    }

    .msg.sent {
      align-self: flex-end;
      background: #4f55d1;
      color: white;
    }

    .msg.received {
      align-self: flex-start;
      background: #344566;
      color: #d1defb;
    }

    #chatInputContainer {
      border-top: 1px solid #586dcc;
      display: flex;
      padding: 13px 16px;
      gap: 10px;
    }

    #chatInput {
      flex: 1;
      padding: 10px 15px;
      border-radius: 18px;
      border: none;
      font-size: 1rem;
      outline: none;
      background: #23283e;
      color: white;
    }

    #chatSendBtn {
      background: #4f55d1;
      border: none;
      color: white;
      font-weight: 700;
      font-size: 1rem;
      border-radius: 18px;
      padding: 9px 21px;
      cursor: pointer;
    }

    #chatSendBtn:disabled {
      opacity: 0.44;
      cursor: not-allowed;
    }

    #chatSendBtn:not(:disabled):hover {
      background: #2b2fff;
    }

    .modal-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1050;
      background: rgba(0, 0, 0, 0.95);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .detalhe-modal {
      max-width: 530px;
      width: 95vw;
      padding: 32px 22px 19px 22px;
      background: #23253f;
      border-radius: 23px;
      box-shadow: 0 13px 44px #2324d8c8;
      position: relative;
    }

    .fechar-detalhe {
      position: absolute;
      top: 12px;
      right: 22px;
      background: none;
      border: none;
      color: #bbccff;
      font-size: 2.4rem;
      font-weight: 700;
      cursor: pointer;
    }

    .detalhe-name {
      color: #fff;
      text-align: center;
      font-size: 2.1rem;
      margin-bottom: 16px;
      font-weight: 700;
    }

    .detalhe-modal img {
      display: block;
      width: 96%;
      max-width: 410px;
      margin: 24px auto 12px auto;
      border-radius: 20px;
      box-shadow: 0 6px 20px #27298ede;
    }

    .detalhe-req {
      font-size: 1.13rem;
      color: #9bdef5;
      font-weight: 600;
      margin: 10px 0;
    }

    .detalhe-desc {
      font-size: 1.06rem;
      color: #c4e7f8;
      margin: 13px 0 21px;
    }

    .detalhe-btn {
      display: block;
      width: 100%;
      margin: 18px auto 0 auto;
      padding: 16px 0;
      font-weight: 700;
      font-size: 1.13rem;
      border-radius: 13px;
      background: linear-gradient(90deg, #6c6efe 0%, #3237bb 100%);
      color: white;
      cursor: pointer;
      border: none;
    }

    .detalhe-btn:hover {
      background: #2326e1;
    }

    @media (max-width: 700px) {
      main {
        max-width: 97vw;
      }

      .sneaker-card {
        width: 97vw;
        max-width: 330px;
      }

      .detalhe-modal img {
        max-width: 98vw;
      }
    }
  </style>
</head>

<body>
  <div id="nav">
    <img class="logo" src="/Galery/BannerRotation.png" alt="logo rotation">
    <a href="/home.html">Home</a>
    <a href="/shop.html">Shop</a>
    <a href="/trocas.html" class="selected">Trocas</a>
    <input type="text" id="txtBusca" placeholder="Buscar sneakers..." />
    <a class="logout-btn" href="/index.html">Sair</a>
    <a href="/perfil.html" class="nav-avatar" id="navAvatar" aria-label="Perfil" title="Perfil">👤</a>

  </div>

  <main>
    <h1 class="reveal">Coloque seu tênis para troca</h1>
    <p class="section-sub reveal" style="margin-top:-8px;">Anuncie um par que você não usa mais e negocie diretamente com quem topar a troca.</p>
    <form id="sneakerForm" enctype="multipart/form-data">
      <label for="shoeName">Nome do Tênis:</label>
      <input type="text" id="shoeName" required>
      <label for="shoeDesc">Descrição:</label>
      <textarea id="shoeDesc" rows="3"></textarea>
      <label for="shoeImgs">Upload até 3 imagens:</label>
      <input id="shoeImgs" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple required>
      <div class="img-preview" id="imgPreview"></div>
      <label for="shoeRequest">Tênis que deseja receber em troca:</label>
      <input type="text" id="shoeRequest" required>
      <button type="submit" class="submit-btn">Adicionar para Troca</button>
    </form>

    <div class="barra-busca-area">
      <input type="text" id="buscaTroca" placeholder="Buscar nos anúncios..." />
    </div>

    <h2>Tenis disponíveis para troca</h2>
    <section id="sneaker-list">
      <div class="skeleton" style="width:375px;min-height:420px;border-radius:22px;"></div>
      <div class="skeleton" style="width:375px;min-height:420px;border-radius:22px;"></div>
    </section>
  </main>

  <div id="chatModal" role="dialog" aria-modal="true" aria-labelledby="chatHeader" hidden>
    <div id="chatWindow">
      <header id="chatHeader">
        <span id="chatTitle">Chat</span>
        <button id="closeChat" aria-label="Fechar chat">&times;</button>
      </header>
      <div id="chatMessages"></div>
      <div id="chatInputContainer">
        <input type="text" id="chatInput" placeholder="Digite sua mensagem..." autocomplete="off" />
        <button id="chatSendBtn" disabled>Enviar</button>
      </div>
    </div>
  </div>

  <script src="/Js/toast.js"></script>
  <script src="/Js/image-check.js"></script>
  <script src="/Js/reveal.js"></script>
  <script src="/Js/nav-search.js"></script>
<script src="/Js/avatar.js"></script>
  <script>
    const form = document.getElementById('sneakerForm'),
      list = document.getElementById('sneaker-list'),
      imgInput = document.getElementById('shoeImgs'),
      imgPreview = document.getElementById('imgPreview');

    let sneakers = [],
      activeChat = null;

    function getUsuarioLogado() {
      try { return JSON.parse(localStorage.getItem('usuarioLogado')); } catch { return null; }
    }

    async function apiFetch(url, options = {}) {
      const token = localStorage.getItem('token');
      const headers = Object.assign({ 'Content-Type': 'application/json' }, options.headers || {});
      if (token) headers['Authorization'] = `Bearer ${token}`;
      const res = await fetch(url, Object.assign({}, options, { headers }));
      return res.json();
    }

    function lerImagemValida(file) {
      return new Promise(resolve => {
        if (!file.type.startsWith('image/')) return resolve(null);
        const reader = new FileReader();
        reader.onload = async e => {
          const dataUrl = e.target.result;
          const ok = await testarImagem(dataUrl);
          resolve(ok ? dataUrl : null);
        };
        reader.onerror = () => resolve(null);
        reader.readAsDataURL(file);
      });
    }

    imgInput.addEventListener('change', async function () {
      imgPreview.innerHTML = '';
      const files = Array.from(this.files).slice(0, 3);
      const resultados = await Promise.all(files.map(lerImagemValida));
      const invalidas = resultados.filter(r => r === null).length;
      if (invalidas > 0) {
        toast(`${invalidas} arquivo(s) não é/são imagens compatíveis (formatos RAW como .DNG não são suportados). Envie JPG, PNG ou WEBP.`, 'error');
      }
      resultados.filter(Boolean).forEach(dataUrl => {
        const imgEl = document.createElement('img');
        imgEl.src = dataUrl;
        imgPreview.appendChild(imgEl);
      });
    });

    async function getBase64Images(files, cb) {
      const valid = Array.from(files).slice(0, 3);
      const resultados = await Promise.all(valid.map(lerImagemValida));
      cb(resultados.filter(Boolean));
    }

    function createCard(sneaker) {
      const card = document.createElement('div');
      card.className = 'sneaker-card';
      let gal = '';
      (sneaker.imagens || []).forEach(img => {
        gal += `<img src="${img}">`;
      });
      const usuario = getUsuarioLogado();
      const isOwner = usuario && sneaker.usuarioId === usuario.id;
      card.innerHTML = `
                <div class="card-gallery">${gal}</div>
                <div class="sneaker-name">${sneaker.nome}</div>
                <div class="sneaker-desc">${sneaker.descricao || ""}</div>
                <div class="sneaker-request"><b>Trocar por:</b> ${sneaker.trocaPor}</div>
                <div class="buttons-container">
                    <button class="proposta-btn" onclick="redirectToDetailPage(${sneaker.id})">Proposta</button>
                    <button class="chat-btn" onclick="openChat(${sneaker.id}, '${sneaker.nome.replace(/'/g, "\\'")}')">Chat</button>
                    ${isOwner ? `<button class="vendido-btn" onclick="markAsSold(${sneaker.id}, this)">Marcar como Vendido</button>` : ''}
                </div>`;
      list.appendChild(card);
      setTimeout(() => card.classList.add('visible'), 120);

      // Redirecionar ao clicar no card inteiro
      card.onclick = () => redirectToDetailPage(sneaker.id);
    }

    async function carregarTrocas() {
      try {
        const data = await apiFetch('/api/trocas');
        sneakers = data.results || [];
      } catch (err) {
        console.error('Erro ao carregar trocas:', err);
        sneakers = [];
      }
      renderSneakers();
    }

    function renderSneakers() {
      list.innerHTML = '';
      if (sneakers.length === 0) {
        list.innerHTML = `
          <div class="empty-state">
            <span class="empty-emoji">🔄</span>
            <p>Nenhuma troca anunciada ainda. Seja o primeiro lá em cima!</p>
          </div>`;
        return;
      }
      sneakers.forEach(createCard);
      observeAllCards();
    }

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      const nome = this.shoeName.value.trim(),
        descricao = this.shoeDesc.value.trim(),
        trocaPor = this.shoeRequest.value.trim(),
        files = this.shoeImgs.files;

      if (!nome || !trocaPor || files.length === 0) {
        toast("Preencha todos os campos obrigatórios!", "error");
        return;
      }
      if (!localStorage.getItem('token')) {
        toast("Você precisa estar logado para anunciar uma troca.", "error");
        return;
      }

      getBase64Images(files, async imagens => {
        if (imagens.length === 0) {
          toast("Nenhuma das imagens enviadas é compatível (formatos RAW como .DNG não são suportados). Envie JPG, PNG ou WEBP.", "error");
          return;
        }
        try {
          const data = await apiFetch('/api/trocas', {
            method: 'POST',
            body: JSON.stringify({ nome, descricao, trocaPor, imagens })
          });
          if (!data.success) { toast(data.message || 'Erro ao criar anúncio.', 'error'); return; }
          toast('Anúncio criado com sucesso!', 'success');
          await carregarTrocas();
          form.reset();
          imgPreview.innerHTML = "";
        } catch (err) {
          console.error(err);
          toast('Erro ao criar anúncio.', 'error');
        }
      });
    });

    // Nova função para redirecionamento
    function redirectToDetailPage(id) {
      window.location.href = `/produto.html?id=${id}`;
    }

    async function openChat(trocaId, sneakerName) {
      activeChat = trocaId;
      document.getElementById('chatTitle').textContent = "Chat - " + sneakerName;
      document.getElementById('chatMessages').innerHTML = '';
      document.getElementById('chatModal').classList.add('active');

      if (!localStorage.getItem('token')) {
        addMsgToChat('seller', 'Você precisa estar logado para conversar. Faça login e tente novamente.');
        document.getElementById('chatInput').disabled = true;
        document.getElementById('chatSendBtn').disabled = true;
        return;
      }
      document.getElementById('chatInput').disabled = false;
      await loadMessages(trocaId);
      document.getElementById('chatInput').value = '';
      document.getElementById('chatSendBtn').disabled = true;
      document.getElementById('chatInput').focus();
    }

    function closeChat() {
      document.getElementById('chatModal').classList.remove('active');
      activeChat = null;
    }

    document.getElementById('closeChat').onclick = closeChat;
    document.getElementById('chatModal').onclick = e => {
      if (e.target == document.getElementById('chatModal')) closeChat();
    };

    async function loadMessages(trocaId) {
      const chatMessages = document.getElementById('chatMessages');
      chatMessages.innerHTML = '';
      try {
        const data = await apiFetch(`/api/trocas/${trocaId}/mensagens`);
        (data.results || []).forEach(m => addMsgToChat(m.remetente, m.texto));
      } catch (err) {
        console.error(err);
      }
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function addMsgToChat(sender, text) {
      const msgDiv = document.createElement('div');
      msgDiv.textContent = text;
      msgDiv.className = 'msg ' + (sender === 'user' ? 'sent' : 'received');
      document.getElementById('chatMessages').appendChild(msgDiv);
      document.getElementById('chatMessages').scrollTop = document.getElementById('chatMessages').scrollHeight;
    }

    document.getElementById('chatInput').addEventListener('input', () => {
      document.getElementById('chatSendBtn').disabled = document.getElementById('chatInput').value.trim() === '';
    });

    document.getElementById('chatSendBtn').onclick = async () => {
      const texto = document.getElementById('chatInput').value.trim();
      if (!activeChat || texto === '') return;
      if (!localStorage.getItem('token')) {
        toast('Você precisa estar logado para enviar mensagens.', 'error');
        return;
      }
      document.getElementById('chatInput').value = '';
      document.getElementById('chatSendBtn').disabled = true;
      try {
        const data = await apiFetch(`/api/trocas/${activeChat}/mensagens`, {
          method: 'POST',
          body: JSON.stringify({ texto })
        });
        if (!data.success) { toast(data.message || 'Erro ao enviar mensagem.', 'error'); return; }
        data.mensagens.forEach(m => addMsgToChat(m.remetente, m.texto));
      } catch (err) {
        console.error(err);
        toast('Erro ao enviar mensagem.', 'error');
      }
    };

    const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          observer.unobserve(entry.target);
        }
      });
    }, {
      threshold: 0.13
    });

    function observeAllCards() {
      document.querySelectorAll('.sneaker-card').forEach(card => {
        if (!card.classList.contains('visible')) observer.observe(card);
      });
    }

    async function markAsSold(id, button) {
      try {
        const data = await apiFetch(`/api/trocas/${id}/vendido`, { method: 'PUT' });
        if (!data.success) { toast(data.message || 'Erro ao marcar como vendido.', 'error'); return; }
        toast('Marcado como vendido!', 'success');
        button.parentNode.parentNode.style.opacity = '0.5';
        button.textContent = "Vendido";
        button.disabled = true;
      } catch (err) {
        console.error(err);
        toast('Erro ao marcar como vendido.', 'error');
      }
    }

    document.getElementById('buscaTroca').addEventListener('input', function () {
      const term = this.value.trim().toLowerCase();
      document.querySelectorAll('.sneaker-card').forEach(card => {
        const txt = card.innerText.toLowerCase();
        card.style.display = term.length === 0 || txt.includes(term) ? "" : "none";
      });
    });

    carregarTrocas().then(() => {
      const chatId = new URLSearchParams(window.location.search).get('chat');
      if (chatId) {
        const troca = sneakers.find(s => String(s.id) === chatId);
        if (troca) openChat(troca.id, troca.nome);
      }
    });
  </script>
</body>

</html>
