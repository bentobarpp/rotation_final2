<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - barpp</title>
    <meta name="description" content="Entre na sua conta barpp.">
    <link rel="icon" href="/Galery/logo-barpp.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/Css/barpp-ui.css">
    <link rel="stylesheet" href="/Css/auth.css">
</head>

<body>

    <img class="auth-logo" src="/Galery/logo-barpp.svg" alt="Logo barpp">

    <div class="auth-card">
        <form id="loginForm">
            <h2>Entrar</h2>

            <div class="auth-field">
                <label for="username">Usuário ou e-mail</label>
                <input type="text" id="username" placeholder="Digite seu usuário" autocomplete="username" required>
            </div>

            <div class="auth-field">
                <label for="password">Senha</label>
                <input type="password" id="password" placeholder="Digite sua senha" autocomplete="current-password" required>
            </div>

            <button type="submit" class="auth-submit" id="loginBtn">Entrar</button>

            <p class="auth-message error" id="errorMessage"></p>

            <p class="auth-switch">
                Ainda não tem uma conta? <a href="/sign-in.html">Criar conta</a>
            </p>
            <p class="auth-guest">
                <a href="/home.html">Continuar sem conta →</a>
            </p>
        </form>
    </div>

    <script src="/Js/login.js"></script>
</body>

</html>
