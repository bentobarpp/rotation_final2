<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Adicionar Peça - barpp</title>
    <meta name="description" content="Área administrativa para adicionar peças ao catálogo da barpp." />
    <link rel="icon" href="/Galery/logo-barpp.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/Css/barpp-ui.css" />
    <link rel="stylesheet" href="/Css/nav.css" />
    <link rel="stylesheet" href="/Css/upload.css" />
</head>
<body>

<header id="nav">
  <div class="topbar">
    <a href="https://www.instagram.com/" target="_blank" rel="noopener">Instagram</a>
    <span class="topbar-msg">Peças autenticadas, direto da comunidade</span>
    <a href="https://wa.me/5547988567247" target="_blank" rel="noopener">Fale no WhatsApp</a>
  </div>
  <div class="nav-main">
    <a href="/home.html" class="brand">
      <img class="logo" src="/Galery/logo-barpp.svg" alt="barpp">
      <span class="wordmark">barpp</span>
    </a>
    <nav class="nav-links">
      <a href="/shop.html?categoria=tenis">Tênis</a>
      <a href="/shop.html?categoria=roupas">Peças</a>
      <a href="/shop.html?categoria=acessorios">Acessórios</a>
      <a href="/trocas.html">Trocas</a>
      <a href="/shop.html">Marcas</a>
      <a href="/home.html#sobre">Sobre</a>
    </nav>
    <div class="nav-right">
      <div class="nav-search">
        <input type="text" id="txtBusca" placeholder="Buscar" />
      </div>
      <span id="navAuth"></span>
    </div>
  </div>
</header>

<div class="upload-container">
    <h2>Adicionar Peça</h2>
    <p class="upload-guest-note" id="restrictedNote" hidden>
      Esta área é restrita ao administrador da barpp.
      <a href="/login.html?next=/upload.html">Entrar com a conta admin</a>
    </p>
    <form id="uploadForm" autocomplete="off">
        <label for="shoeName">Nome da Peça</label>
        <input type="text" id="shoeName" maxlength="100" placeholder="Ex: Nike Air Max" required />

        <div class="field-row">
          <div>
            <label for="shoeCategoria">Categoria</label>
            <select id="shoeCategoria" required>
                <option value="tenis">Tênis</option>
                <option value="roupas">Roupas</option>
                <option value="acessorios">Acessórios</option>
            </select>
          </div>
          <div>
            <label for="shoeCondicao">Condição</label>
            <select id="shoeCondicao" required>
                <option value="novo">Novo</option>
                <option value="seminovo">Seminovo</option>
                <option value="usado" selected>Usado</option>
            </select>
          </div>
        </div>

        <div class="field-row">
          <div>
            <label for="shoeMarca">Marca</label>
            <input type="text" id="shoeMarca" maxlength="60" placeholder="Ex: Nike" />
          </div>
          <div>
            <label for="shoePrice">Preço (R$)</label>
            <input type="number" min="0" step="0.01" id="shoePrice" placeholder="Ex: 499.90" required />
          </div>
        </div>

        <label for="shoeSize">Tamanho</label>
        <input type="text" id="shoeSize" maxlength="10" placeholder="Ex: 42 ou M" required />

        <label for="shoeDescription">Descrição</label>
        <textarea id="shoeDescription" maxlength="600" placeholder="Descreva o produto, estado de uso, detalhes, etc." required></textarea>

        <label for="shoeMainImage">Foto da Peça</label>
        <input type="file" id="shoeMainImage" accept="image/png,image/jpeg,image/webp,image/gif" required />
        <div id="imgPreview" class="upload-img-preview"></div>

        <button type="submit" class="btn" style="width:100%;margin-top:18px;">Adicionar Peça</button>
    </form>
</div>

<footer class="rodape">
    <p class="rodape-texto">
        Encontrou algum problema? Entre em contato através do e-mail
        <a href="mailto:barppsup@gmail.com">barppsup@gmail.com</a>
    </p>
</footer>

<script src="/Js/toast.js"></script>
<script src="/Js/barpp.js"></script>
<script src="/Js/image-check.js"></script>
<script src="/Js/nav-search.js"></script>
<script src="/Js/nav-auth.js"></script>
<script src="/Js/upload.js"></script>

</body>
</html>
