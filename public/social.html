<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Social - Rotation</title>
  <meta name="description" content="Conecte-se com outros apaixonados por sneakers na Rotation." />
  <link rel="stylesheet" href="/Css/rotation-ui.css" />
  <style>
    body {
      background: linear-gradient(to bottom, #26272b, #38393e 85%);
      color: #f4f4f4;
      font-family: 'Segoe UI', Arial, sans-serif;
      margin: 0;
      padding: 0;
      padding-top: 80px;
    }
    #nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      background: #232426;
      color: #fff;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      padding: 18px 0 14px 0;
      gap: 15px;
      font-size: 1.08rem;
      box-shadow: 0 4px 12px 0 rgba(0,0,0,0.10);
      z-index: 1000;
    }
    #nav .logo {
      height: 43px;
      margin-right: 8px;
      vertical-align: middle;
    }
    #nav a {
      color: #fff;
      text-decoration: none;
      font-weight: 500;
      border-radius: 8px;
      padding: 7px 18px;
      margin: 0 7px;
      transition: background 0.25s;
    }
    #nav a:hover,
    #nav a.selected {
      background: rgba(108,110,254,0.11);
    }
    #nav input[type="text"] {
      padding: 7px 12px;
      border-radius: 8px;
      border: none;
      background-color: #33353a;
      color: #fff;
      margin-left: 16px;
      font-size: 1rem;
      max-width: 210px;
    }

    .search-result-container {
      max-width: 1080px;
      margin: 0 auto 15px auto;
      padding: 8px 0 2px 0;
      width: 93vw;
      min-height: 1.5em;
      position: relative;
      z-index: 10;
    }
    .search-result-list {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      justify-content: flex-start;
      margin-top: 10px;
    }
    .search-result-item {
      background: #23243a;
      border-radius: 11px;
      box-shadow: 0 3px 16px #0002;
      padding: 18px 22px 14px 22px;
      display: flex;
      align-items: center;
      min-width: 208px;
      max-width: 270px;
      gap: 20px;
    }
    .search-result-item img {
      width: 65px;
      height: 65px;
      border-radius: 7px;
      object-fit: contain;
      background: #191a1e;
      box-shadow: 0 2px 8px #0009;
    }
    .result-info {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .result-title {
      font-weight: 800;
      font-size: 1.12rem;
      color: #bbccff;
    }
    .result-link {
      color: #6c6efe;
      text-decoration: none;
      font-weight: bold;
      margin-top: 3px;
      font-size: .95rem;
      display: inline-block;
      border-radius: 5px;
      padding: 4px 10px;
      background: rgba(108,110,254,0.090);
      transition: background .18s;
    }
    .result-link:hover {
      background: #6c6efe;
      color: #fff;
    }
    .no-result {
      padding: 7px 21px;
      color: #bbccff;
      font-weight: 600;
      font-size: 1.09rem;
      letter-spacing: 1px;
    }
    #cabecalho {
      max-width: 980px;
      margin: 40px auto 25px;
      padding: 0 20px;
      text-align: center;
    }
    #cabecalho h1 {
      font-size: 2.7rem;
      margin-bottom: 8px;
      color: white;
      font-weight: 700;
      letter-spacing: 1px;
    }
    #cabecalho p {
      font-size: 1.25rem;
      color: #bbccff;
      font-weight: 500;
    }
    main.conteudo {
      max-width: 980px;
      margin: 0 auto 50px;
      padding: 0 20px;
    }
    article.cartao-sobre {
      background-color: rgba(38,38,38,0.85);
      border-radius: 14px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.16);
      padding: 25px 30px 30px 30px;
      color: #cbd2ff;
      font-size: 1.12rem;
    }
    article.cartao-sobre h2 {
      margin-bottom: 20px;
      font-weight: 700;
      font-size: 1.55rem;
      color: white;
      letter-spacing: 0.03em;
    }
    ul {
      list-style: none;
      padding-left: 0;
      margin: 0;
    }
    ul li {
      padding: 14px 12px;
      border-bottom: 1px solid #474961;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1.10rem;
      color: #d4d9ff;
    }
    ul li strong {
      color: #bbccff;
      margin-right: 7px;
      font-weight: 700;
    }
    ul li button {
      padding: 6px 14px;
      background-color: #494ba8;
      border: none;
      border-radius: 8px;
      color: white;
      cursor: pointer;
      font-weight: 700;
      transition: background-color 0.25s ease;
    }
    ul li button:hover {
      background-color: #6c6efe;
      box-shadow: 0 0 14px #6c6efeaa;
    }
    .feed-item {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 12px;
      border-bottom: 1px solid #474961;
    }
    .feed-item:last-child { border-bottom: none; }
    .feed-item img {
      width: 52px;
      height: 52px;
      border-radius: 10px;
      object-fit: contain;
      background: #191a1e;
      flex-shrink: 0;
    }
    .feed-item .feed-text { flex: 1; }
    .feed-item .feed-tag {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #a5a8ff;
      display: block;
      margin-bottom: 3px;
    }
    .feed-item .feed-tag.troca { color: #f0a5df; }
    footer.rodape {
      background-color: #232426;
      color: white;
      text-align: center;
      padding: 28px 20px;
      font-size: 1rem;
      border-radius: 0 0 14px 14px;
    }
    footer.rodape p {
      margin: 0;
    }
    footer.rodape a {
      color: #90aaff;
      text-decoration: underline;
    }
    @media (max-width: 650px) {
      #cabecalho {margin-top: 60px;}
      ul li {
        font-size: 1rem;
        flex-direction: column;
        align-items: flex-start;
        gap: 7px;
      }
      ul li button {
        margin-top: 8px;
        width: 100%;
      }
      #nav {
        font-size: 1rem;
        padding: 12px 0;
      }
      #nav input[type="text"] {
        max-width: 120px;
      }
    }
  </style>
</head>
<body>
<div id="nav">
  <img class="logo" src="/Galery/BannerRotation.png" alt="logo rotation">
  <a href="/home.html">Home</a>
  <a href="/shop.html">Shop</a>
  <a href="/trocas.html">Trocas</a>
  <a href="/social.html" class="selected">Social</a>
  <a href="/perfil.html">Perfil</a>
  <input type="text" id="txtBusca" placeholder="Buscar"/>
  <a class="logout-btn" href="/index.html">Sair</a>

</div>

<div class="search-result-container">
  <div id="search-results" class="search-result-list"></div>
</div>

<section id="cabecalho">
  <h1 class="reveal">Comunidade</h1>
  <p class="reveal">O que a galera está anunciando agora.</p>
</section>

<main class="conteudo">
  <article id="postagens" class="cartao-sobre reveal">
    <h2>Atividade recente</h2>
    <ul id="feedList">
      <li><div class="skeleton" style="height:52px;border-radius:10px;"></div></li>
      <li><div class="skeleton" style="height:52px;border-radius:10px;"></div></li>
      <li><div class="skeleton" style="height:52px;border-radius:10px;"></div></li>
    </ul>
  </article>
</main>

<footer class="rodape">
  <p class="rodape-texto">
    Encontrou algum problema? Entre em contato através do e-mail 
    <a href="mailto:rotationsup@gmail.com.br">rotationsup@gmail.com.br</a>
  </p>
</footer>

<script src="/Js/reveal.js"></script>
<script src="/Js/nav-search.js"></script>
<script>
// ================== TENIS REAIS VINDOS DA API ====================
let allShoes = [];
async function carregarProdutos() {
  try {
    const res = await fetch('/api/produtos');
    const data = await res.json();
    allShoes = (data.results || []).map(p => ({ img: p.imagemUrl, title: p.nome, id: p.id }));
  } catch (err) {
    console.error('Erro ao carregar produtos:', err);
  }
}
carregarProdutos();

// ================== FEED DE ATIVIDADE REAL ==================
async function carregarFeed() {
  const feedList = document.getElementById('feedList');
  try {
    const [produtosRes, trocasRes] = await Promise.all([
      fetch('/api/produtos').then(r => r.json()),
      fetch('/api/trocas').then(r => r.json()),
    ]);

    const itens = [
      ...(produtosRes.results || []).map(p => ({
        tipo: 'venda',
        nome: p.vendedorNome || 'Rotation',
        texto: `anunciou "${p.nome}" à venda por R$ ${Number(p.preco).toFixed(2).replace('.', ',')}`,
        img: p.imagemUrl,
        link: `/detalhes.html?id=${p.id}`,
      })),
      ...(trocasRes.results || []).map(t => ({
        tipo: 'troca',
        nome: t.donoNome || 'Alguém',
        texto: `quer trocar "${t.nome}" por "${t.trocaPor}"`,
        img: (t.imagens && t.imagens[0]) || '',
        link: `/produto.html?id=${t.id}`,
      })),
    ].slice(0, 12);

    if (itens.length === 0) {
      feedList.innerHTML = `
        <div class="empty-state">
          <span class="empty-emoji">💬</span>
          <p>Ninguém anunciou nada ainda. <a href="/upload.html">Comece você!</a></p>
        </div>`;
      return;
    }

    feedList.innerHTML = '';
    itens.forEach(item => {
      const li = document.createElement('li');
      li.className = 'feed-item';
      li.innerHTML = `
        <img src="${item.img}" alt="">
        <div class="feed-text">
          <span class="feed-tag ${item.tipo}">${item.tipo === 'venda' ? 'Venda' : 'Troca'}</span>
          <strong>${item.nome}</strong> ${item.texto}
        </div>
        <a href="${item.link}"><button type="button">Ver</button></a>
      `;
      feedList.appendChild(li);
    });
  } catch (err) {
    console.error('Erro ao carregar feed:', err);
    feedList.innerHTML = `<div class="empty-state"><p>Não foi possível carregar a atividade recente.</p></div>`;
  }
}
carregarFeed();

const txtBusca = document.getElementById('txtBusca');
const searchResults = document.getElementById('search-results');

// Busca funcional global dos tênis, igual à home/shop!
txtBusca.addEventListener('input', function() {
  let termo = this.value.trim().toLowerCase();
  searchResults.innerHTML = '';
  if (termo.length === 0) return;

  let encontrados = allShoes.filter(s => s.title.toLowerCase().includes(termo));
  if (encontrados.length === 0) {
    searchResults.innerHTML = `<div class="no-result">Nenhum tênis encontrado.</div>`;
    return;
  }
  encontrados.forEach(s => {
    const div = document.createElement('div');
    div.className = 'search-result-item';
    div.innerHTML = `
      <img src="${s.img}" alt="${s.title}">
      <div class="result-info">
        <div class="result-title">${s.title}</div>
        <a href="detalhes.html?id=${s.id}" class="result-link">Ver detalhes</a>
      </div>
    `;
    searchResults.appendChild(div);
  });
});
</script>
</body>
</html>
