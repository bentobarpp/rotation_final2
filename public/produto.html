<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Detalhes do Produto</title>
    <meta name="description" content="Veja detalhes do produto selecionado para troca.">
    <link rel="stylesheet" href="/Css/rotation-ui.css" />
    <style>
        body {
            background: #26272B;
            color: #f4f4f4;
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 80px 0 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: #232426;
            color: #fff;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            padding: 18px 0 14px 0;
            gap: 15px;
            font-size: 1.05rem;
            box-shadow: 0 4px 12px 0 rgba(0, 0, 0, 0.08);
            box-sizing: border-box;
            z-index: 1000;
        }

        #nav .logo { height: 40px; margin-right: 12px; vertical-align: middle; }

        #nav a {
            color: #fff;
            text-decoration: none;
            font-weight: 500;
            margin: 0 7px;
            border-radius: 5px;
            padding: 7px 16px;
            transition: background 0.25s;
        }

        #nav a:hover, #nav a.selected { background: rgba(108, 110, 254, 0.11); }

        .container {
            max-width: 900px;
            width: 100%;
            background: rgba(38, 38, 38, 0.92);
            border-radius: 16px;
            box-shadow: 0 6px 26px #181c2855;
            padding: 20px;
            margin-top: 30px;
        }

        .product-gallery {
            display: flex;
            gap: 10px;
            flex-wrap: nowrap;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 20px;
            justify-content: center;
        }

        .product-gallery img {
            width: 100%;
            max-width: 500px;
            height: auto;
            border-radius: 10px;
            object-fit: cover;
            box-shadow: 0 2px 10px #0005;
            transition: transform 0.3s;
        }

        .product-gallery img:hover {
            transform: scale(1.05);
        }

        .product-details {
            text-align: center;
        }

        .product-name {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            color: #fff;
        }

        .description,
        .request {
            margin-top: 10px;
            color: #ddf;
            font-size: 1.1rem;
        }

        .buttons-container {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        button {
            padding: 12px 24px;
            border-radius: 10px;
            border: none;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.3s;
            font-size: 1.1rem;
        }

        .btn-proposta {
            background: linear-gradient(90deg, #6c6efe 0%, #3237bb 100%);
            color: white;
        }

        .btn-proposta:hover {
            background: #2b2ffb;
        }

        .btn-chat {
            background: #434647;
            color: #bbccee;
        }

        .btn-chat:hover {
            background: #686d83;
            color: white;
        }

        .btn-voltar {
            background: #444;
            color: #ddd;
        }

        .btn-voltar:hover {
            background: #666;
        }
    </style>
</head>

<body>
    <div id="nav">
        <img class="logo" src="/Galery/BannerRotation.png" alt="logo rotation" />
        <a href="/home.html">Home</a>
        <a href="/shop.html">Shop</a>
        <a href="/trocas.html" class="selected">Trocas</a>
        <a class="logout-btn" href="/index.html">Sair</a>
        <a href="/perfil.html" class="nav-avatar" id="navAvatar" aria-label="Perfil" title="Perfil">👤</a>
    </div>

    <div class="container" id="product-container">
        <div class="skeleton" style="height:38px;width:50%;margin:0 auto 20px;"></div>
        <div class="skeleton" style="height:280px;width:100%;margin:0 auto 16px;border-radius:10px;"></div>
    </div>

    <script src="/Js/avatar.js"></script>
    <script>
        function getQueryParam(param) {
            return new URLSearchParams(window.location.search).get(param);
        }

        async function init() {
            const id = getQueryParam('id');
            const container = document.getElementById('product-container');
            if (!id) {
                container.innerHTML = '<div class="empty-state"><span class="empty-emoji">🚫</span><p>Produto não encontrado. <a href="/trocas.html">Voltar para Trocas</a></p></div>';
                return;
            }
            try {
                const res = await fetch(`/api/trocas/${encodeURIComponent(id)}`);
                const data = await res.json();
                if (!data.success) {
                    container.innerHTML = '<div class="empty-state"><span class="empty-emoji">🚫</span><p>Produto não encontrado. <a href="/trocas.html">Voltar para Trocas</a></p></div>';
                    return;
                }
                const product = data.troca;
                const gallery = (product.imagens || [])
                    .map(img => `<img src="${img}" alt="${product.nome}">`)
                    .join('');
                container.innerHTML = `
                    <div class="product-gallery">${gallery}</div>
                    <div class="product-details">
                        <h1 class="product-name">${product.nome}</h1>
                        <p class="description">${product.descricao ? product.descricao : "Sem descrição disponível."}</p>
                        <p class="request"><strong>Trocar por:</strong> ${product.trocaPor}</p>
                    </div>
                    <div class="buttons-container">
                        <button class="btn-chat" id="btnChat">Conversar / Fazer Proposta</button>
                        <button class="btn-voltar" onclick="window.history.back()">Voltar</button>
                    </div>
                `;
                document.getElementById('btnChat').onclick = () => {
                    window.location.href = `/trocas.html?chat=${product.id}`;
                };
            } catch (err) {
                console.error(err);
                container.innerHTML = '<div class="empty-state"><span class="empty-emoji">🚫</span><p>Produto não encontrado. <a href="/trocas.html">Voltar para Trocas</a></p></div>';
            }
        }

        window.onload = init;
    </script>
</body>

</html>
