<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shop - Rotation</title>
  <meta name="description" content="Encontre as melhores ofertas." />
  <link rel="stylesheet" href="/Css/toast.css" />
  <style>
    body {
      background: linear-gradient(to bottom, #26272B, #38393e 85%);
      color: #f4f4f4;
      font-family: 'Segoe UI', Arial, sans-serif;
      margin: 0;
      padding-top: 80px;
    }

    #nav {
      position: fixed;
      top: 0;
      width: 100%;
      background: #232426;
      color: #fff;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      padding: 18px 0 14px 0;
      gap: 15px;
      font-size: 1.05rem;
      box-shadow: 0 4px 12px 0 rgba(0, 0, 0, 0.08);
      z-index: 1000;
    }

    #nav .logo {
      height: 40px;
      margin-right: 12px;
      vertical-align: middle;
    }

    #nav a {
      color: #fff;
      text-decoration: none;
      font-weight: 500;
      margin: 0 7px;
      border-radius: 8px;
      padding: 7px 18px;
      transition: background 0.25s;
    }

    #nav a:hover,
    #nav a.selected {
      background: rgba(108, 110, 254, 0.11);
    }

    #nav input[type="text"] {
      padding: 7px 12px;
      border-radius: 8px;
      border: none;
      background-color: #33353a;
      color: #fff;
      margin-left: 16px;
      font-size: 1rem;
      max-width: 210px;
    }

    .search-result-container {
      max-width: 1080px;
      margin: 0 auto 15px auto;
      padding: 8px 0 2px 0;
      width: 93vw;
      min-height: 1.5em;
      position: relative;
      z-index: 10;
    }

    .search-result-list {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      justify-content: flex-start;
      margin-top: 10px;
    }

    .search-result-item {
      background: #23243a;
      border-radius: 11px;
      box-shadow: 0 3px 16px #0002;
      padding: 18px 22px 14px 22px;
      display: flex;
      align-items: center;
      min-width: 208px;
      max-width: 270px;
      gap: 20px;
    }

    .search-result-item img {
      width: 65px;
      height: 65px;
      border-radius: 7px;
      object-fit: contain;
      background: #191a1e;
      box-shadow: 0 2px 8px #0009;
    }

    .result-info {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .result-title {
      font-weight: 800;
      font-size: 1.12rem;
      color: #bbccff;
    }

    .result-link {
      color: #6c6efe;
      text-decoration: none;
      font-weight: bold;
      margin-top: 3px;
      font-size: .95rem;
      display: inline-block;
      border-radius: 5px;
      padding: 4px 10px;
      background: rgba(108, 110, 254, 0.090);
      transition: background .18s;
    }

    .result-link:hover {
      background: #6c6efe;
      color: #fff;
    }

    .no-result {
      padding: 7px 21px;
      color: #bbccff;
      font-weight: 600;
      font-size: 1.09rem;
      letter-spacing: 1px;
    }

    .container {
      max-width: 1080px;
      margin: 40px auto 30px auto;
      padding: 0 2vw;
    }

    h1 {
      text-align: center;
      margin-bottom: 18px;
      font-weight: 700;
      letter-spacing: .5px;
      color: #fff;
      font-size: 2.3rem;
    }

    .buy-btn {
      background: linear-gradient(90deg, #434343 0%, #262626 100%);
      color: #fff;
      font-weight: bold;
      letter-spacing: .5px;
      border: none;
      border-radius: 9px;
      padding: 12px 40px;
      font-size: 1.15rem;
      margin: 26px auto 18px auto;
      display: block;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 2px 12px 0 rgba(0, 0, 0, 0.11);
      transition: background .3s, transform .18s;
    }

    .buy-btn:hover {
      background: linear-gradient(90deg, #292929 0%, #434343 100%);
      transform: translateY(-2px) scale(1.025);
    }

    #productList {
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
      justify-content: center;
    }

    .produto {
      background: #212228e5;
      border-radius: 15px;
      box-shadow: 0 4px 18px 0 rgba(0, 0, 0, 0.11);
      width: 270px;
      padding: 22px 19px 15px 19px;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
      transition: box-shadow .24s, transform .18s;
    }

    .produto:hover {
      box-shadow: 0 8px 28px 2px rgba(77, 110, 254, 0.082);
      transform: translateY(-2px) scale(1.014);
    }

    .produto img {
      width: 100%;
      max-width: 175px;
      border-radius: 9px;
      margin-bottom: 16px;
      background: #191a1e;
      object-fit: contain;
      aspect-ratio: 1 / 1;
      box-shadow: 0 2px 9px 0 rgba(0, 0, 0, 0.07);
    }

    .produto a {
      color: inherit;
      text-decoration: none;
    }

    .produto h2 {
      font-size: 1.10rem;
      color: #fff;
      font-weight: 600;
      margin: 2px 0 6px;
      text-transform: capitalize;
    }

    .preço,
    .info {
      color: #fff;
      font-size: 1.04rem;
      font-weight: 500;
      line-height: 1.22;
      margin: 0 0 3px 0;
    }

    .info {
      color: #bbccff;
      margin-bottom: 7px;
      font-size: .99rem;
    }

    .remove-btn {
      background-color: #cf2e2e;
      color: #fff;
      font-weight: 600;
      border: none;
      border-radius: 7px;
      padding: 7px 12px;
      cursor: pointer;
      margin: 10px auto 0;
      transition: background 0.2s;
      box-shadow: 0 1px 8px #00000017;
    }

    .remove-btn:hover {
      background-color: #951f1f;
    }

    .rodape {
      background: #232426;
      color: #ededed;
      text-align: center;
      padding: 32px 2vw 26px 2vw;
      margin-top: 28px;
      border-radius: 14px 14px 0 0;
      font-size: 1.05rem;
    }

    .rodape a {
      color: #90aaff;
      text-decoration: underline;
    }

    @media (max-width:700px) {
      .container {
        padding: 3vw 1vw;
      }

      #productList {
        gap: 15px;
      }

      .produto {
        padding: 15px 7px;
        width: 98vw;
        max-width: 340px;
      }
    }
  </style>
</head>

<body>

  <div id="nav">
    <img class="logo" src="/Galery/BannerRotation.png" alt="logo rotation">
    <a href="/home.html">Home</a>
    <a href="/shop.html" class="selected">Shop</a>
    <a href="/trocas.html">Trocas</a>
    <a href="/social.html">Social</a>
    <a href="/perfil.html">Perfil</a>
    <input type="text" id="txtBusca" placeholder="Buscar" />
    <a class="logout-btn" href="/index.html">Sair</a>

  </div>

  <div class="search-result-container">
    <div id="search-results" class="search-result-list"></div>
  </div>

  <div class="container">
    <h1>Encontre os boots mais desejados e exclusivos do momento</h1>
    <a href="/upload.html" class="buy-btn">Vender um Tênis</a>
    <div id="productList"></div>
  </div>

  <footer class="rodape">
    <p class="rodape-texto">Encontrou algum problema? Entre em contato através do e-mail <a
        href="mailto:rotationsup@gmail.com.br">rotationsup@gmail.com.br</a></p>
  </footer>

  <script src="/Js/toast.js"></script>
  <script>
    const usuario = JSON.parse(localStorage.getItem("usuarioLogado"));

    async function carregarProdutos() {
      let products = [];
      try {
        const response = await fetch('/api/produtos');
        const data = await response.json();
        if (data.success) {
          products = data.results;
        } else {
          console.error('Erro ao buscar tênis:', data.message);
        }
      } catch (err) {
        console.error('Erro na requisição:', err);
      }

      renderProducts(products);
    }

    function formatPreco(valor) {
      return Number(valor).toFixed(2).replace('.', ',');
    }

    async function marcarVendido(id) {
      const token = localStorage.getItem('token');
      if (!token) {
        toast('Você precisa estar logado.', 'error');
        return;
      }
      const res = await fetch(`/api/produtos/${id}/vendido`, {
        method: 'PUT',
        headers: { 'Authorization': `Bearer ${token}` }
      });
      const data = await res.json();
      if (data.success) {
        toast('Produto marcado como vendido!', 'success');
        carregarProdutos();
      } else {
        toast(data.message || 'Erro ao marcar como vendido.', 'error');
      }
    }

    function renderProducts(products) {
      const productList = document.getElementById('productList');
      productList.innerHTML = '';

      products.forEach((prod) => {
        const isOwner = usuario && prod.usuarioId === usuario.id;
        const div = document.createElement('div');
        div.className = 'produto';
        div.setAttribute('data-id', prod.id);
        div.innerHTML = `
      <a href="detalhes.html?id=${prod.id}">
        <img src="${prod.imagemUrl}" alt="${prod.nome}">
        <h2>${prod.nome}</h2>
      </a>
      <p class="preço">R$ ${formatPreco(prod.preco)}</p>
      <p class="info">Tamanho: ${prod.tamanho || 'N/D'}</p>
      <a href="detalhes.html?id=${prod.id}" class="buy-btn">Comprar Agora</a>
      ${isOwner ? `<button type="button" class="remove-btn" data-id="${prod.id}">Marcar como vendido</button>` : ''}
    `;
        productList.appendChild(div);
      });

      productList.querySelectorAll('.remove-btn').forEach(function (button) {
        button.addEventListener('click', function () {
          if (confirm('Você tem certeza que deseja marcar este item como vendido?')) {
            marcarVendido(this.getAttribute('data-id'));
          }
        });
      });

      configurarBusca(products);
    }

    function configurarBusca(products) {
      const txtBusca = document.getElementById('txtBusca');
      const searchResults = document.getElementById('search-results');

      txtBusca.addEventListener('input', function () {
        let termo = this.value.trim().toLowerCase();
        searchResults.innerHTML = '';
        if (termo.length === 0) return;

        let encontrados = products.filter(p => p.nome.toLowerCase().includes(termo));
        if (encontrados.length === 0) {
          searchResults.innerHTML = `<div class="no-result">Nenhum tênis encontrado.</div>`;
          return;
        }

        encontrados.forEach(p => {
          const div = document.createElement('div');
          div.className = 'search-result-item';
          div.innerHTML = `
        <img src="${p.imagemUrl}" alt="${p.nome}">
        <div class="result-info">
          <div class="result-title">${p.nome}</div>
          <a href="detalhes.html?id=${p.id}" class="result-link">Ver detalhes</a>
        </div>
      `;
          searchResults.appendChild(div);
        });
      });
    }


    carregarProdutos();
  </script>

</body>

</html>
