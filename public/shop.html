<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Peças - barpp</title>
  <meta name="description" content="Encontre tênis, roupas e acessórios autenticados na barpp." />
  <link rel="icon" href="/Galery/logo-barpp.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/Css/barpp-ui.css" />
  <link rel="stylesheet" href="/Css/nav.css" />
  <link rel="stylesheet" href="/Css/shop.css" />
</head>
<body>

<header id="nav">
  <div class="topbar">
    <a href="https://www.instagram.com/" target="_blank" rel="noopener">Instagram</a>
    <span class="topbar-msg">Peças autenticadas, direto da comunidade</span>
    <a href="https://wa.me/5547988567247" target="_blank" rel="noopener">Fale no WhatsApp</a>
  </div>
  <div class="nav-main">
    <a href="/home.html" class="brand">
      <img class="logo" src="/Galery/logo-barpp.svg" alt="barpp">
      <span class="wordmark">barpp</span>
    </a>
    <nav class="nav-links">
      <a href="/shop.html?categoria=tenis">Tênis</a>
      <a href="/shop.html?categoria=roupas">Peças</a>
      <a href="/shop.html?categoria=acessorios">Acessórios</a>
      <a href="/trocas.html">Trocas</a>
      <a href="/shop.html">Marcas</a>
      <a href="/home.html#sobre">Sobre</a>
    </nav>
    <div class="nav-right">
      <div class="nav-search">
        <input type="text" id="txtBusca" placeholder="Buscar" />
      </div>
      <span id="navAuth"></span>
    </div>
  </div>
</header>

<div class="page-container">
  <div class="category-header">
    <div class="category-row">
      <div>
        <p class="category-kicker">Categoria</p>
        <h1 class="category-title" id="categoryTitle">Peças</h1>
        <p class="category-sub" id="categorySub">Tênis, roupas e acessórios autenticados.</p>
      </div>
      <div class="category-count" id="categoryCount"></div>
    </div>
  </div>

  <form class="filter-bar" id="filterForm">
    <div class="filter-field">
      <label for="fMarca">Marca</label>
      <select id="fMarca"><option value="">Todas</option></select>
    </div>
    <div class="filter-field">
      <label for="fCondicao">Condição</label>
      <select id="fCondicao">
        <option value="">Todas</option>
        <option value="novo">Novo</option>
        <option value="seminovo">Seminovo</option>
        <option value="usado">Usado</option>
      </select>
    </div>
    <div class="filter-field">
      <label for="fTamanho">Tamanho</label>
      <select id="fTamanho"><option value="">Todos</option></select>
    </div>
    <div class="filter-field">
      <label for="fPrecoMin">Preço mín R$</label>
      <input type="number" id="fPrecoMin" min="0" step="0.01" placeholder="Mínimo">
    </div>
    <div class="filter-field">
      <label for="fPrecoMax">Preço máx R$</label>
      <input type="number" id="fPrecoMax" min="0" step="0.01" placeholder="Máximo">
    </div>
    <div class="filter-field">
      <label for="fOrdenar">Ordenar</label>
      <select id="fOrdenar">
        <option value="relevancia">Relevância</option>
        <option value="recentes">Mais recentes</option>
        <option value="menor-preco">Menor preço</option>
        <option value="maior-preco">Maior preço</option>
      </select>
    </div>
  </form>

  <div class="shop-toolbar">
    <a href="/upload.html" class="btn" id="adminAddBtn" hidden>+ Adicionar peça</a>
  </div>

  <div id="productList" class="product-grid">
    <div class="skeleton" style="height:300px;"></div>
    <div class="skeleton" style="height:300px;"></div>
    <div class="skeleton" style="height:300px;"></div>
    <div class="skeleton" style="height:300px;"></div>
  </div>
</div>

<footer class="rodape">
  <p class="rodape-texto">Encontrou algum problema? Entre em contato através do e-mail
    <a href="mailto:barppsup@gmail.com">barppsup@gmail.com</a></p>
</footer>

<script src="/Js/toast.js"></script>
<script src="/Js/barpp.js"></script>
<script src="/Js/reveal.js"></script>
<script src="/Js/nav-search.js"></script>
<script src="/Js/nav-auth.js"></script>
<script src="/Js/shop.js"></script>

</body>
</html>
