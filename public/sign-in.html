<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar Conta - barpp</title>
  <meta name="description" content="Crie sua conta na barpp.">
  <link rel="icon" href="/Galery/logo-barpp.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Baloo+2:wght@800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/Css/barpp-ui.css">
  <link rel="stylesheet" href="/Css/auth.css">
</head>
<body>

  <svg class="auth-logo" viewBox="0 0 200 200" role="img" aria-label="barpp"><rect width="200" height="200" rx="40" fill="#0d0d0d"/><text x="100" y="140" text-anchor="middle" font-family="'Baloo 2', sans-serif" font-weight="800" font-size="130" letter-spacing="-22" fill="#ffffff">BP</text></svg>

  <div class="auth-card">
    <form id="signInForm">
      <h2>Criar conta</h2>

      <div class="auth-field">
        <label for="nome">Nome</label>
        <input type="text" id="nome" placeholder="Como podemos te chamar?" autocomplete="name" required>
      </div>

      <div class="auth-field">
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="voce@email.com" autocomplete="email" required>
      </div>

      <div class="auth-field">
        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="Mín. 6 caracteres + 1 especial" minlength="6" autocomplete="new-password" required>
        <small class="auth-hint">Precisa ter no mínimo 6 caracteres e 1 caractere especial (ex: ! @ # $ % *)</small>
      </div>

      <button type="submit" class="auth-submit" id="signInBtn">Cadastrar</button>

      <p class="auth-message" id="msg"></p>

      <p class="auth-switch">
        Já tem uma conta? <a href="/login.html">Entrar</a>
      </p>
      <p class="auth-guest">
        <a href="/home.html">Continuar sem conta →</a>
      </p>
    </form>
  </div>

  <script src="/Js/sign-in.js"></script>
</body>
</html>
